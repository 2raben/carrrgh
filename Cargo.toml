[package]
name = "bevy-template"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Car Drive: a three-lane arcade driving game"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "audio",
    "ui",
] }
fastrand = "2.5.0"

# Native profile storage (ADR 0007); a browser build needs another backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
